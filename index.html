<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The World of Ninth Age Communities</title>
  <meta name="description" content="Find your local The Ninth Age community: choose a country, pick a regional group and get its Discord, Messenger and other links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="world">
    <h1 class="visually-hidden">The World of Ninth Age Communities</h1>
    <div class="corner">
      <a class="t9a-link" href="https://www.the-ninth-age.com/" target="_blank" rel="noopener">
        <img src="assets/ninth-age-logo.webp" alt="The Ninth Age logo">
        <span>Learn more about Ninth Age</span>
      </a>
      <div class="join-cta">
        <p>Want to put yourself on the map? Click on the country and start there!</p>
        <button type="button" class="join-button" id="join-button" aria-pressed="false" aria-label="Put yourself on the map">+</button>
      </div>
    </div>
    <div class="world-frame">
      <div class="join-hint" id="join-hint" role="status" hidden>
        Click your country to start
        <button type="button" data-join-cancel aria-label="Cancel">&times;</button>
      </div>
      <svg id="world-map" class="world-map" role="img" aria-label="World map. Choose a country to see its communities."></svg>
      <div class="map-controls" aria-label="Map zoom">
        <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
        <button type="button" data-zoom="out" aria-label="Zoom out">&minus;</button>
        <button type="button" data-zoom="reset" aria-label="Reset zoom">&#8634;</button>
      </div>
      <div id="tooltip" class="tooltip" role="status" hidden></div>
    </div>

    <form class="country-search" id="country-search" autocomplete="off">
      <label for="country-input">Or search for a country</label>
      <input id="country-input" list="country-names" placeholder="e.g. Poland">
      <datalist id="country-names"></datalist>
      <button type="submit">Open</button>
    </form>
  </main>

  <dialog id="country-dialog" class="country-dialog" aria-labelledby="country-title">
    <div class="parchment">
      <header class="country-header">
        <h2 id="country-title" class="ribbon"></h2>
        <button type="button" class="close" data-close aria-label="Close">&times;</button>
      </header>
      <div class="country-body">
        <div class="country-map-wrap">
          <svg id="country-map" class="country-map" role="img"></svg>
          <div id="community-card" class="community-card" role="dialog" aria-modal="false" hidden></div>
        </div>
        <aside class="country-aside">
          <h3>Communities</h3>
          <ul id="community-list" class="community-list"></ul>
          <p class="empty" id="community-empty" hidden>
            No communities charted here yet.
            <a href="https://discord.com/users/273431876390092800" target="_blank" rel="noopener" title="Message us on Discord">Know one? Tell us.</a>
          </p>
        </aside>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
